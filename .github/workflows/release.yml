name: Release

# Builds, signs and publishes IPDial.
#   • Manual run:  Actions → Release → Run workflow
#   • Tag run:     git push origin v1.2.2   (tag must equal app version)
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64   base64 of the release keystore (.jks / .keystore)
#   STORE_PASSWORD    keystore password
#   KEY_ALIAS         signing key alias
#   KEY_PASSWORD      signing key password
#
# See RELEASING.md for the full walkthrough.

on:
  workflow_dispatch:
    inputs:
      draft:
        description: "Publish as a draft release"
        required: false
        default: false
        type: boolean
      prerelease:
        description: "Mark the release as a pre-release"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & sign
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      code: ${{ steps.version.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read version from app/build.gradle
        id: version
        run: |
          VERSION=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]+"([^"]+)".*/\1/p' app/build.gradle | head -1)
          CODE=$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*/\1/p' app/build.gradle | head -1)
          if [ -z "$VERSION" ] || [ -z "$CODE" ]; then
            echo "::error::Could not read versionName/versionCode from app/build.gradle"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building IPDial $VERSION (build $CODE)"

      - name: Verify tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match app version v${{ steps.version.outputs.version }}. Bump versionName in app/build.gradle or push the correct tag."
            exit 1
          fi

      # gradle.properties is gitignored, so CI must recreate the flags the build needs.
      - name: Configure Gradle for CI
        run: |
          {
            echo "android.disallowKotlinSourceSets=false"
            echo "org.gradle.jvmargs=-Xmx4g -XX:+UseG1GC"
            echo "org.gradle.daemon=false"
          } > gradle.properties

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing. Add it in Settings → Secrets and variables → Actions."
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/ipdial-release.jks"
          test -s "$RUNNER_TEMP/ipdial-release.jks" || { echo "::error::Decoded keystore is empty — is KEYSTORE_BASE64 a valid base64 .jks?"; exit 1; }

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build signed APK and App Bundle
        env:
          STORE_FILE: ${{ runner.temp }}/ipdial-release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease :app:bundleRelease --stacktrace

      - name: Verify APK signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::$APK was not generated"; exit 1; }
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Stage release artifacts
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/IPDial-v${VERSION}.apk"
          if [ -f app/build/outputs/bundle/release/app-release.aab ]; then
            cp app/build/outputs/bundle/release/app-release.aab "dist/IPDial-v${VERSION}.aab"
          fi
          (cd dist && sha256sum ./* > SHA256SUMS.txt)
          ls -lh dist

      - name: Remove signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/ipdial-release.jks"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ipdial-release
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: ipdial-release
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: IPDial v${{ needs.build.outputs.version }} (build ${{ needs.build.outputs.code }})
          generate_release_notes: true
          body: |
            **IPDial v${{ needs.build.outputs.version }}** (build ${{ needs.build.outputs.code }})

            - Signed release APK: `IPDial-v${{ needs.build.outputs.version }}.apk`
            - Play Store bundle: `IPDial-v${{ needs.build.outputs.version }}.aab`
            - SHA-256 checksums: `SHA256SUMS.txt`

            Built from commit `${{ github.sha }}`.
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          fail_on_unmatched_files: true
          files: |
            dist/IPDial-v${{ needs.build.outputs.version }}.apk
            dist/IPDial-v${{ needs.build.outputs.version }}.aab
            dist/SHA256SUMS.txt
