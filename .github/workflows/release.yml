name: Release signed APK

# Builds and publishes a signed release APK to GitHub Releases whenever the
# app version is bumped (either versionCode or versionName changes in
# app/build.gradle on the default branch). Can also be triggered manually.
#
# Required repository secrets:
#   KEYSTORE_BASE64       base64-encoded signing keystore (.jks / .keystore)
#   STORE_PASSWORD        keystore password
#   KEY_ALIAS             signing key alias
#   KEY_PASSWORD          signing key password
#   GOOGLE_SERVICES_JSON  base64-encoded app/google-services.json (gitignored)
#
# The app's release signingConfig reads STORE_FILE/STORE_PASSWORD/KEY_ALIAS/
# KEY_PASSWORD from the environment, so no build.gradle changes are needed.

# PAUSED: automatic triggers disabled. The workflow can still be run manually
# from the Actions tab (workflow_dispatch).
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-version-bump:
    name: Detect version bump
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      code: ${{ steps.check.outputs.code }}
      bumped: ${{ steps.check.outputs.bumped }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Compare version against previous commit
        id: check
        run: |
          NEW_NAME=$(grep -E '^\s*versionName\s' app/build.gradle | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          NEW_CODE=$(grep -E '^\s*versionCode\s' app/build.gradle | head -1 | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          OLD_NAME=$(git show HEAD~1:app/build.gradle 2>/dev/null | grep -E '^\s*versionName\s' | head -1 | sed -E 's/.*"([^"]+)".*/\1/' || echo "none")
          OLD_CODE=$(git show HEAD~1:app/build.gradle 2>/dev/null | grep -E '^\s*versionCode\s' | head -1 | sed -E 's/[^0-9]*([0-9]+).*/\1/' || echo "0")
          echo "version=$NEW_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$NEW_CODE" >> "$GITHUB_OUTPUT"
          if [ "$NEW_NAME" != "$OLD_NAME" ] || [ "$NEW_CODE" != "$OLD_CODE" ]; then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            echo "Version bumped: $OLD_NAME ($OLD_CODE) -> $NEW_NAME ($NEW_CODE)"
          else
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "No version change ($NEW_NAME @ $NEW_CODE); skipping release."
          fi

  build-release:
    name: Build signed APKs
    needs: check-version-bump
    if: needs.check-version-bump.outputs.bumped == 'true'
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_org.gradle.jvmargs: "-Xmx4g"
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Add google-services.json (from secret)
        run: |
          if [ -z "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret is missing — the google-services plugin refuses to build without it."
            exit 1
          fi
          echo "${{ secrets.GOOGLE_SERVICES_JSON }}" | base64 -d > app/google-services.json

      - name: Decode signing keystore
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing."
            exit 1
          fi
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks

      - name: Build release APKs
        run: ./gradlew :app:assembleRelease
        env:
          STORE_FILE: ${{ github.workspace }}/keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Verify build outputs
        run: |
          cd app/build/outputs/apk/release
          for f in app-universal-release.apk app-arm64-v8a-release.apk app-armeabi-v7a-release.apk; do
            [ -f "$f" ] && ls -lh "$f" || echo "missing: $f"
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version-bump.outputs.version }}
          name: IPDial v${{ needs.check-version-bump.outputs.version }} (build ${{ needs.check-version-bump.outputs.code }})
          body: |
            Automated release for **IPDial v${{ needs.check-version-bump.outputs.version }}** (build ${{ needs.check-version-bump.outputs.code }}).
            Generated from commit `${{ github.sha }}`.

            ## APKs
            - `app-universal-release.apk` — universal APK (all supported ABIs)
            - `app-arm64-v8a-release.apk` — 64-bit only
            - `app-armeabi-v7a-release.apk` — 32-bit only
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/app-universal-release.apk
            app/build/outputs/apk/release/app-arm64-v8a-release.apk
            app/build/outputs/apk/release/app-armeabi-v7a-release.apk