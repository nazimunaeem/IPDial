name: Release signed APK

# Builds, tests, and publishes a signed release APK to GitHub Releases.
# Automatic triggers are disabled — trigger manually from the Actions tab (workflow_dispatch).
#
# Required repository secrets:
#   KEYSTORE_BASE64   base64-encoded signing keystore (.jks / .keystore)
#   STORE_PASSWORD    keystore password
#   KEY_ALIAS         signing key alias
#   KEY_PASSWORD      signing key password

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  check-version-bump:
    name: Detect version bump
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      code: ${{ steps.check.outputs.code }}
      bumped: ${{ steps.check.outputs.bumped }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Check version in app/build.gradle
        id: check
        run: |
          NEW_NAME=$(grep -E '^\s*versionName\s' app/build.gradle | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          NEW_CODE=$(grep -E '^\s*versionCode\s' app/build.gradle | head -1 | sed -E 's/[^0-9]*([0-9]+).*/\1/')
          OLD_NAME=$(git show HEAD~1:app/build.gradle 2>/dev/null | grep -E '^\s*versionName\s' | head -1 | sed -E 's/.*"([^"]+)".*/\1/' || echo "none")
          OLD_CODE=$(git show HEAD~1:app/build.gradle 2>/dev/null | grep -E '^\s*versionCode\s' | head -1 | sed -E 's/[^0-9]*([0-9]+).*/\1/' || echo "0")
          echo "version=$NEW_NAME" >> "$GITHUB_OUTPUT"
          echo "code=$NEW_CODE" >> "$GITHUB_OUTPUT"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            echo "Release triggered (${{ github.event_name }}): $NEW_NAME ($NEW_CODE)"
          elif [ "$NEW_NAME" != "$OLD_NAME" ] || [ "$NEW_CODE" != "$OLD_CODE" ]; then
            echo "bumped=true" >> "$GITHUB_OUTPUT"
            echo "Version bumped: $OLD_NAME ($OLD_CODE) -> $NEW_NAME ($NEW_CODE)"
          else
            echo "bumped=false" >> "$GITHUB_OUTPUT"
            echo "No version change ($NEW_NAME @ $NEW_CODE); skipping release."
          fi

  build-release:
    name: Build signed APK
    needs: check-version-bump
    if: needs.check-version-bump.outputs.bumped == 'true'
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_org.gradle.jvmargs: "-Xmx4g"
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run unit tests
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest

      - name: Decode signing keystore
        run: |
          if [ -z "${{ secrets.KEYSTORE_BASE64 }}" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing."
            exit 1
          fi
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > keystore.jks

      - name: Build signed release APK
        run: ./gradlew :app:assembleRelease
        env:
          STORE_FILE: ${{ github.workspace }}/keystore.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Prepare release APK
        run: |
          cd app/build/outputs/apk/release
          if [ ! -f app-release.apk ]; then
            echo "::error::Expected app-release.apk was not generated."
            ls -la
            exit 1
          fi
          cp app-release.apk "IPDial-v${{ needs.check-version-bump.outputs.version }}.apk"
          ls -lh "IPDial-v${{ needs.check-version-bump.outputs.version }}.apk"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.check-version-bump.outputs.version }}
          name: IPDial v${{ needs.check-version-bump.outputs.version }} (build ${{ needs.check-version-bump.outputs.code }})
          generate_release_notes: true
          body: |
            Release **IPDial v${{ needs.check-version-bump.outputs.version }}** (build ${{ needs.check-version-bump.outputs.code }}).
            Built from commit `${{ github.sha }}`.
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/IPDial-v${{ needs.check-version-bump.outputs.version }}.apk