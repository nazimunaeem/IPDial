name: Release Signed APK

# Builds, signs and publishes DialDuo using GitHub Actions Secrets with release notes.
#   • Manual run:  Actions → Release Signed APK → Run workflow
#   • Tag run:     git push origin v2.0.0   (tag must equal v<versionName>)
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   KEYSTORE_BASE64   base64-encoded release keystore (.jks / .keystore)
#   STORE_PASSWORD    keystore password
#   KEY_ALIAS         signing key alias
#   KEY_PASSWORD      signing key password
#
# Release notes priority:
#   1. Manual `release_notes` input (when triggered via Run workflow)
#   2. Matching `## v<versionName>` section in RELEASE_NOTES.md
#   3. Auto-generated commit summary since the previous v* tag

on:
  workflow_dispatch:
    inputs:
      release_notes:
        description: "Release notes (leave blank to use RELEASE_NOTES.md or commit history)"
        required: false
        default: ""
        type: string
      draft:
        description: "Publish as a draft release"
        required: false
        default: false
        type: boolean
      prerelease:
        description: "Mark the release as a pre-release"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build & sign APK
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      code: ${{ steps.version.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Accept Android SDK licenses
        run: |
          SDK_DIR="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=${SDK_DIR}" >> "$GITHUB_ENV"
          mkdir -p "${SDK_DIR}/licenses"
          for hash in \
            24333f8a63b6825ea9c5514f83c2829b004d1fee \
            d56f5187479451eabf01fb78af6dfcb131a6481e \
            8933bad161af4178b1185d1a37fbf41ea5269c55; do
            grep -qxF "$hash" "${SDK_DIR}/licenses/android-sdk-license" 2>/dev/null || echo "$hash" >> "${SDK_DIR}/licenses/android-sdk-license"
          done
          for hash in \
            84831b9409646a918e30573bab4c9c91346d8abd \
            504667f4c0de7af1a06de9f4b1727b84351f2910; do
            grep -qxF "$hash" "${SDK_DIR}/licenses/android-sdk-preview-license" 2>/dev/null || echo "$hash" >> "${SDK_DIR}/licenses/android-sdk-preview-license"
          done

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Read version from app/build.gradle
        id: version
        run: |
          VERSION=$(sed -nE 's/^[[:space:]]*versionName[[:space:]]+"([^"]+)".*/\1/p' app/build.gradle | head -1)
          CODE=$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]+([0-9]+).*/\1/p' app/build.gradle | head -1)
          if [ -z "$VERSION" ] || [ -z "$CODE" ]; then
            echo "::error::Could not read versionName/versionCode from app/build.gradle"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building DialDuo $VERSION (build $CODE)"

      - name: Verify tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          if [ "${GITHUB_REF_NAME}" != "v${{ steps.version.outputs.version }}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match app version v${{ steps.version.outputs.version }}. Bump versionName in app/build.gradle or push the correct tag."
            exit 1
          fi

      # gradle.properties is gitignored, so CI recreates the flags the build needs.
      - name: Configure Gradle for CI
        run: |
          {
            echo "android.useAndroidX=true"
            echo "android.nonTransitiveRClass=true"
            echo "android.uniquePackageNames=false"
            echo "android.r8.strictFullModeForKeepRules=false"
            echo "android.r8.optimizedResourceShrinking=true"
            echo "android.disallowKotlinSourceSets=false"
            echo "org.gradle.jvmargs=-Xmx4g -XX:+UseG1GC"
            echo "org.gradle.daemon=false"
          } > gradle.properties
          chmod +x gradlew

      - name: Validate & decode signing secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::KEYSTORE_BASE64 secret is missing. Add it in Settings → Secrets and variables → Actions."
            exit 1
          fi
          for var in STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!var}" ]; then
              echo "::error::$var secret is missing. Add it in Settings → Secrets and variables → Actions."
              exit 1
            fi
          done
          printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 --decode > "$RUNNER_TEMP/dialduo-release.jks"
          test -s "$RUNNER_TEMP/dialduo-release.jks" || { echo "::error::Decoded keystore is empty — verify KEYSTORE_BASE64 is valid base64."; exit 1; }

      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Build signed APK
        env:
          STORE_FILE: ${{ runner.temp }}/dialduo-release.jks
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: Verify APK signature
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          test -f "$APK" || { echo "::error::$APK was not generated"; exit 1; }
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "$APK"

      - name: Stage release artifacts
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/DialDuo-v${VERSION}.apk"
          ls -lh dist

      - name: Generate release notes
        env:
          INPUT_NOTES: ${{ github.event.inputs.release_notes }}
          VERSION: ${{ steps.version.outputs.version }}
          CODE: ${{ steps.version.outputs.code }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          NOTES_CONTENT=""

          # 1. Prefer explicit workflow_dispatch release_notes input
          if [ -n "$(printf '%s' "$INPUT_NOTES" | tr -d '[:space:]')" ]; then
            NOTES_CONTENT="$INPUT_NOTES"
          # 2. Otherwise extract matching ## v<version> section from RELEASE_NOTES.md
          elif [ -f RELEASE_NOTES.md ]; then
            NOTES_CONTENT=$(awk -v ver="## v${VERSION}" '
              $0 == ver { found=1; next }
              found && /^## / { exit }
              found { print }
            ' RELEASE_NOTES.md | sed -e '/./,$!d')
          fi

          # 3. Fallback to git commit log since previous v* tag
          if [ -z "$(printf '%s' "$NOTES_CONTENT" | tr -d '[:space:]')" ]; then
            PREV_TAG=$(git tag --list 'v*' --sort=-v:refname | grep -Fxv "v${VERSION}" | head -1 || true)
            if [ -n "$PREV_TAG" ]; then
              NOTES_CONTENT=$(git log "${PREV_TAG}..HEAD" --no-merges --pretty=format:"- %s (%h)" | head -n 30)
            else
              NOTES_CONTENT=$(git log -n 20 --no-merges --pretty=format:"- %s (%h)")
            fi
          fi

          {
            echo "## DialDuo v${VERSION} (build ${CODE})"
            echo ""
            if [ -n "$(printf '%s' "$NOTES_CONTENT" | tr -d '[:space:]')" ]; then
              printf '%s\n' "$NOTES_CONTENT"
              echo ""
            fi
            echo "### Downloads"
            echo "- Signed release APK: \`DialDuo-v${VERSION}.apk\`"
            echo ""
            echo "_Built from commit \`${COMMIT_SHA}\`._"
          } > dist/release-notes.md

          cat dist/release-notes.md

      - name: Remove signing keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/dialduo-release.jks"

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dialduo-release
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: dialduo-release
          path: dist

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: DialDuo v${{ needs.build.outputs.version }} (build ${{ needs.build.outputs.code }})
          body_path: dist/release-notes.md
          generate_release_notes: true
          draft: ${{ inputs.draft || false }}
          prerelease: ${{ inputs.prerelease || false }}
          fail_on_unmatched_files: true
          files: |
            dist/DialDuo-v${{ needs.build.outputs.version }}.apk
